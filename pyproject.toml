[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-assembler"
version = "0.1.0"
description = "Cut two audio files at long silences and join the pieces in the order given by a CSV list."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
audio-assembler = "audio_assembler.cli:main"

[project.gui-scripts]
audio-assembler-gui = "audio_assembler.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audio_assembler.gui" = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
