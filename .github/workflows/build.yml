name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the draft release on version tags

jobs:
  ffmpeg:
    name: Small LGPL ffmpeg for Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ hashFiles('packaging/ffmpeg/build_ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm make pkg-config curl xz-utils zip
          bash packaging/ffmpeg/build_ffmpeg.sh ffmpeg-out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-audio-win64
          path: ffmpeg-out/

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install -r packaging/requirements-build.txt && pip install -e . --no-deps
      - run: python -m pytest -q

  windows:
    name: Windows tests, app and installer
    needs: ffmpeg
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-audio-win64
          path: ffmpeg-out
      - run: pip install -r packaging/requirements-build.txt && pip install -e . --no-deps
      - run: python packaging/get_ffmpeg.py --zip ffmpeg-out/ffmpeg-audio-win64.zip
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -SkipTests
      - name: Smoke test of the built app (bundled ffmpeg only)
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from audiogen import *; import pathlib; p = pathlib.Path('smoke'); p.mkdir(); t = make_track([2, 3], 3.0, 0.3, rate=44100, seed=1); write_wav(p / 'S_LV.wav', t.samples, 44100); write_wav(p / 'S_EN.wav', t.samples, 44100); write_order(p / 'S_ORDER.csv', [(1, 'LV', 1, 1), (2, 'EN', 2, 1), (3, 'LV', 2, 0), (4, 'EN', 1, 0)])"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "dist\Audio Assembler\audio-assembler.exe" lesson smoke\S_LV.wav smoke\S_EN.wav smoke\S_ORDER.csv --match-loudness
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path smoke\S_FINAL.mp3)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/AudioAssembler-*-Setup.exe
      - name: Draft release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem dist\AudioAssembler-*-Setup.exe) + @(Get-Item ffmpeg-out\ffmpeg-audio-win64.zip) + @(Get-ChildItem ffmpeg-out\sources\*)
          gh release create $env:GITHUB_REF_NAME --draft --title "Audio Assembler $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file RELEASE_NOTES.md $assets.FullName
